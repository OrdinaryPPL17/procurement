<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京鸿坤进出口 · 采购跟单</title>
<style>
:root{
  --paper:#F7F6F2;
  --card:#FFFFFF;
  --ink:#1B2A3A;
  --ink-soft:#415061;
  --line:#DBD8CE;
  --line-soft:#EAE8E0;
  --safety:#E8630A;
  --safety-soft:#FDEFE3;
  --approve:#1F7A4D;
  --approve-soft:#E6F2EB;
  --reject:#B3372B;
  --reject-soft:#F8E9E7;
  --steel:#6B7684;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(27,42,58,.06),0 4px 14px rgba(27,42,58,.07);
  --shadow-lg:0 6px 30px rgba(27,42,58,.18);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:36px 36px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--safety);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 顶栏:图纸标题栏样式 ===== */
header{background:var(--card);border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:40}
.hd{display:flex;align-items:stretch;max-width:1600px;margin:0 auto}
.hd-title{display:flex;align-items:center;gap:12px;padding:12px 20px;border-right:1px solid var(--line)}
.hd-title h1{font-size:17px;font-weight:800;letter-spacing:.08em}
.hd-title .sub{font-family:var(--mono);font-size:11px;color:var(--steel);letter-spacing:.06em}
.hd-mid{flex:1;display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.hd-right{display:flex;align-items:center;gap:10px;padding:10px 20px;border-left:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--steel)}
.dot.ok{background:var(--approve)}
.dot.bad{background:var(--reject)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);transition:background .15s}
.btn:hover{background:var(--line-soft)}
.btn-primary{background:var(--safety);border-color:var(--safety);color:#fff}
.btn-primary:hover{background:#CF5605}
.btn-ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-ink:hover{background:#2C3F54}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{color:var(--reject);border-color:var(--reject)}
.btn-danger:hover{background:var(--reject-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== 筛选行 ===== */
.filters{max-width:1600px;margin:0 auto;padding:14px 20px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{width:auto}
.filters input[type=search]{width:220px}
.count-note{font-family:var(--mono);font-size:12px;color:var(--steel);margin-left:auto}

/* ===== 看板 ===== */
.board{max-width:1600px;margin:0 auto;padding:14px 20px 60px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start}
.col{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:var(--r);min-height:200px}
.col-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:2px solid var(--ink)}
.col-hd .nm{font-weight:800;letter-spacing:.12em;font-size:13px}
.col-hd .ct{font-family:var(--mono);font-size:12px;color:#fff;background:var(--ink);border-radius:99px;min-width:22px;text-align:center;padding:1px 7px}
.col-body{padding:10px;display:flex;flex-direction:column;gap:10px}
.col.drag-over{outline:2px dashed var(--safety);outline-offset:-4px}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 12px 10px;cursor:pointer;transition:transform .12s, box-shadow .12s}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.card .rid{font-family:var(--mono);font-size:11px;color:var(--steel);display:flex;justify-content:space-between;align-items:center}
.card h3{font-size:14px;font-weight:700;margin:4px 0 6px;line-height:1.35}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--line-soft);color:var(--ink-soft);font-family:var(--mono)}
.tag.job{background:var(--ink);color:#fff}
.tag.due{background:var(--safety-soft);color:var(--safety);font-weight:700}
.tag.due.overdue{background:var(--reject);color:#fff}
.pri{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700}
.pri.高{background:var(--reject-soft);color:var(--reject)}
.pri.中{background:var(--safety-soft);color:var(--safety)}
.pri.低{background:var(--line-soft);color:var(--steel)}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--steel)}
.card .foot .att{font-family:var(--mono)}

/* 跟单条 —— 签名元素 */
.rail{display:flex;gap:3px;margin:8px 0 8px}
.rail i{flex:1;height:5px;border-radius:2px;background:var(--line-soft)}
.rail i.on{background:var(--ink)}
.rail i.now{background:var(--safety)}
.rail i.dead{background:var(--reject)}

/* ===== 抽屉 ===== */
.drawer-mask{position:fixed;inset:0;background:rgba(27,42,58,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-mask.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--paper);z-index:51;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.open{transform:translateX(0)}
.dw-hd{background:var(--card);border-bottom:2px solid var(--ink);padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dw-hd h2{font-size:17px;font-weight:800;line-height:1.35}
.dw-hd .rid{font-family:var(--mono);font-size:12px;color:var(--steel);margin-bottom:4px}
.dw-body{flex:1;overflow-y:auto;padding:18px 20px 40px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.sec-hd{padding:9px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:12px;letter-spacing:.14em;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#fff,#FBFAF7)}
.sec-bd{padding:14px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--steel)}
.kv dd{font-weight:500}
.kv dd.mono{font-family:var(--mono)}

/* 状态大戳 */
.stamp{font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.2em;border:2px solid var(--ink);color:var(--ink);border-radius:6px;padding:5px 12px;transform:rotate(-2deg);white-space:nowrap}
.stamp.s-审批{border-color:var(--safety);color:var(--safety)}
.stamp.s-物流{border-color:var(--approve);color:var(--approve)}
.stamp.s-完结{border-color:var(--approve);color:var(--approve);background:var(--approve-soft)}
.stamp.s-已取消{border-color:var(--reject);color:var(--reject)}

/* 报价表 */
table.qt{width:100%;border-collapse:collapse;font-size:13px}
table.qt th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--steel);border-bottom:1px solid var(--line);padding:6px 8px}
table.qt td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.qt td.num{font-family:var(--mono)}
tr.sel{background:var(--approve-soft)}
tr.sel td:first-child{position:relative}
.pick{font-size:11px;color:var(--approve);font-weight:800}

/* 附件 */
.att-box{background:#F4F2EC;border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;margin-top:6px}
.att-grid{display:flex;flex-wrap:wrap;gap:6px}
.att-grid:not(:empty){margin-bottom:8px}
.att-item{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 1px 1px rgba(27,42,58,.05);cursor:pointer;padding:5px 8px;max-width:100%}
.att-item:hover{border-color:var(--safety);background:var(--safety-soft)}
.att-item img{width:22px;height:22px;object-fit:cover;border-radius:3px;display:block;background:var(--line-soft);flex-shrink:0}
.att-item .fx{font-family:var(--mono);font-size:9px;font-weight:700;color:#fff;background:var(--steel);border-radius:3px;padding:3px 5px;line-height:1;flex-shrink:0;letter-spacing:.02em}
.att-item .nm{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.att-item .del{color:var(--steel);font-size:12px;line-height:1;padding:2px 3px;border-radius:3px;flex-shrink:0}
.att-item .del:hover{color:#fff;background:var(--reject)}
.ten{font-size:13px;font-weight:400;color:var(--steel);margin-top:2px;font-family:var(--sans)}
.ten-sm{font-size:11px;color:var(--steel);margin-top:-2px;margin-bottom:4px;line-height:1.35}
.ten-inline{color:var(--steel);font-size:12px}
.sup-link{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
.sup-link .lk{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:12px;padding:4px 6px;border-radius:4px;cursor:pointer}
.sup-link .lk:hover{background:var(--safety-soft)}
.sup-link .lk .id{font-family:var(--mono);color:var(--steel)}
.sup-link .lk .st{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--line-soft);color:var(--ink-soft)}
.sup-link .sum{font-size:12px;font-weight:700;margin-bottom:4px}
.chip.alert{border-color:var(--reject);color:var(--reject);cursor:pointer;font-weight:700}
.chip.alert.on{background:var(--reject);color:#fff}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;position:static}
  #printArea{font-family:var(--sans);color:#000}
}
#printArea{display:none}
body.readonly #btnNew,body.readonly #btnBulk,body.readonly #btnEditInfo,body.readonly #btnEditOrder,body.readonly #btnEditShip,
body.readonly .upl-zone,body.readonly .att-item .del,body.readonly #supAddBtn,body.readonly [data-supedit],
body.readonly .proj-hd .addbtn,body.readonly #dwBody .actions,body.readonly #dwBody .act-note,
body.readonly #dwBody .qt td:last-child,body.readonly #dwBody .qt th:last-child,
body.readonly #qSup,body.readonly #qCur,body.readonly #qPrice,body.readonly #qLead,body.readonly #qNote,
body.readonly #dwBody .row2:has(#qSup),body.readonly #dwBody .row2:has(#qLead),body.readonly #dwBody [onclick^="addQuote"]{display:none!important}
body.readonly .card{cursor:pointer}
.ro-tag{background:var(--steel);color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;margin-left:6px;letter-spacing:.05em}
.att-sub{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink)}
.att-sub .tip{font-weight:400;letter-spacing:0;color:var(--steel);font-size:11px}
.att-grid:empty{display:none}
.upl-zone{border:1px dashed #C9C4B6;border-radius:6px;padding:10px;text-align:center;color:var(--steel);font-size:12px;background:rgba(255,255,255,.55);cursor:pointer;transition:border-color .15s,background .15s}
.upl-zone:hover,.upl-zone.over{border-color:var(--safety);color:var(--safety);background:#fff}

/* 时间线 */
.tl{list-style:none}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl li:last-child{padding-bottom:2px}
.tl li::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.tl li.hot::before{border-color:var(--safety);background:var(--safety)}
.tl .when{font-family:var(--mono);font-size:11px;color:var(--steel)}
.tl .what{font-size:13px}
.tl .what b{font-weight:700}
.tl .note{font-size:12px;color:var(--ink-soft);background:var(--line-soft);border-radius:4px;padding:4px 8px;margin-top:3px;display:inline-block}

/* 操作区 */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.act-note{margin-top:10px}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(27,42,58,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.modal-mask.open{display:flex}
.modal{background:var(--paper);border-radius:10px;width:min(560px,100%);box-shadow:var(--shadow-lg);border-top:4px solid var(--safety)}
.md-hd{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center}
.md-hd h2{font-size:16px;font-weight:800;letter-spacing:.06em}
.md-bd{padding:16px 20px 20px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.04em}
.fld .hint{font-size:11px;color:var(--steel);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md-ft{padding:0 20px 20px;display:flex;justify-content:flex-end;gap:10px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;box-shadow:var(--shadow-lg);animation:pop .2s}
.tst.err{background:var(--reject)}
.tst.ok{background:var(--approve)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 图片预览 */
#lightbox{position:fixed;inset:0;background:rgba(15,22,30,.9);z-index:98;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw;max-height:82vh;border-radius:6px}
#lightbox .cap{color:#fff;font-family:var(--mono);font-size:12px}

/* 空状态 */
.empty{color:var(--steel);font-size:12px;text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:6px}

@media(max-width:1100px){.board{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){
  .board{grid-template-columns:1fr}
  .hd{flex-wrap:wrap}
  .hd-title{border-right:none;width:100%;border-bottom:1px solid var(--line)}
  .hd-right{border-left:none;margin-left:auto}
  .row2{grid-template-columns:1fr}
  .filters input[type=search]{width:100%}
}

/* ===== 登录页 ===== */
#loginGate{position:fixed;inset:0;background:var(--paper);z-index:100;display:flex;align-items:center;justify-content:center;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:36px 36px;}
#loginGate.hidden{display:none}
.login-card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow-lg);width:min(360px,92vw);padding:30px 28px}
.login-card h1{font-size:20px;margin-bottom:2px}
.login-card .lg-sub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--steel);margin-bottom:22px}
.login-card .fld{margin-bottom:12px}
.login-err{color:var(--reject);font-size:13px;min-height:18px;margin:4px 0 8px}

/* ===== 供应商 ===== */
#supList{max-height:56vh;overflow-y:auto;padding-right:4px;margin-right:-4px}
#supList::-webkit-scrollbar{width:9px}
#supList::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
#supList::-webkit-scrollbar-thumb:hover{background:var(--steel)}
#bRows{max-height:44vh;overflow-y:auto;padding-right:4px;margin-right:-4px}
.md-bd{max-height:none}
.sup-item{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:6px;overflow:hidden}
.sup-item .sup-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer}
.sup-item .sup-hd:hover{background:var(--safety-soft)}
.sup-item .sup-chev{color:var(--steel);font-size:11px;transition:transform .15s;flex-shrink:0}
.sup-item.open .sup-chev{transform:rotate(90deg)}
.sup-item .sup-body{display:none;padding:0 12px 10px 12px;border-top:1px solid var(--line-soft)}
.sup-item.open .sup-body{display:block}
.sup-item .sup-cnt{font-size:11px;color:var(--steel);white-space:nowrap}
.sup-item .sup-nm{flex:1;font-weight:700}
.sup-item .sup-en{font-size:12px;color:var(--steel);font-weight:400;font-family:var(--mono)}
.sup-item .sup-meta{margin-top:9px;font-size:12px;color:var(--ink-soft);display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.sup-item .sup-meta b{font-weight:700;color:var(--steel);white-space:nowrap}
.sup-empty{text-align:center;color:var(--steel);padding:22px;border:1px dashed var(--line);border-radius:var(--r)}
.prod-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line-soft);border-radius:6px;padding:6px 10px;margin-bottom:6px;background:var(--card);font-size:13px}
.prod-row .pn{font-weight:700}
.prod-row .ps{color:var(--steel);font-family:var(--mono);font-size:12px}
.prod-add{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.sup-prods{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.sup-prods span{font-size:12px;background:var(--safety-soft);color:var(--safety);border-radius:4px;padding:2px 8px}
@media(max-width:560px){.prod-add{grid-template-columns:1fr}}
/* ===== 项目进度视图 ===== */
.view-tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.view-tabs button{padding:5px 12px;background:var(--card);color:var(--ink-soft);font-weight:700;font-size:12px;border-right:1px solid var(--line)}
.view-tabs button:last-child{border-right:none}
.view-tabs button.on{background:var(--ink);color:#fff}
.proj-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.proj-bar .hint{font-size:12px;color:var(--steel)}
.proj-hd .addbtn{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;color:var(--ink-soft);background:#fff;flex-shrink:0}
.proj-hd .addbtn:hover{border-color:var(--safety);color:var(--safety)}
.brow{display:grid;grid-template-columns:92px 1fr 1fr 148px 30px;gap:6px;align-items:center;margin-bottom:6px}
.brow input{padding:6px 8px;font-size:13px}
.brow .brm{color:var(--steel);font-size:13px;padding:4px;border-radius:4px;text-align:center}
.brow .brm:hover{color:#fff;background:var(--reject)}
.bhead{display:grid;grid-template-columns:92px 1fr 1fr 148px 30px;gap:6px;font-size:11px;font-weight:700;color:var(--steel);letter-spacing:.06em;margin-bottom:4px}
@media(max-width:640px){.brow,.bhead{grid-template-columns:1fr 1fr}.bhead{display:none}}
.bulk-prev{border:1px solid var(--line-soft);border-radius:6px;background:#FBFAF7;padding:8px 10px;font-size:12px;max-height:170px;overflow:auto}
.bulk-prev table{width:100%;border-collapse:collapse}
.bulk-prev td{padding:2px 6px;border-bottom:1px solid var(--line-soft)}
.bulk-prev .sn{font-family:var(--mono);color:var(--safety);font-weight:700;white-space:nowrap}
.bulk-prev .en{color:var(--steel)}
.proj-wrap{max-width:1200px;margin:0 auto;padding:14px 20px 60px;display:flex;flex-direction:column;gap:14px}
.proj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.proj-hd{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.proj-hd .pj{font-family:var(--mono);font-weight:800;font-size:15px;background:var(--ink);color:#fff;padding:3px 10px;border-radius:4px}
.proj-hd .pct{font-weight:800;font-size:15px;min-width:44px;text-align:right}
.proj-hd .cnt{font-size:12px;color:var(--steel)}
.proj-hd .warn{font-size:12px;color:var(--reject);font-weight:700}
.bar{flex:1;height:9px;background:var(--line-soft);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.done{background:var(--approve)}
.bar i.prog{background:var(--safety)}
.proj-bd{display:none;padding:4px 0 8px}
.proj.open .proj-bd{display:block}
.proj.open .proj-hd .chev{transform:rotate(90deg)}
.chev{color:var(--steel);transition:transform .15s;display:inline-block}
.psub{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto auto auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:13px}
.psub:last-child{border-bottom:none}
.psub:hover{background:var(--safety-soft)}
.psub .sn{font-family:var(--mono);font-weight:700;color:var(--safety)}
.psub .st{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--line-soft);color:var(--ink-soft);white-space:nowrap}
.psub .st.物流{background:var(--approve-soft);color:var(--approve)}
.psub .st.完结{background:var(--approve);color:#fff}
.psub .st.已取消{background:var(--reject-soft);color:var(--reject)}
.psub .amt{font-family:var(--mono);color:var(--ink-soft);white-space:nowrap}
.psub .dd{font-family:var(--mono);font-size:12px;color:var(--steel);white-space:nowrap}
.psub .dd.overdue{color:var(--reject);font-weight:700}
.proj-sum{padding:8px 16px;font-size:12px;color:var(--ink-soft);background:#FBFAF7;display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line-soft)}
.proj-sum b{font-family:var(--mono)}
@media(max-width:700px){.psub{grid-template-columns:1fr auto;gap:4px 8px}.psub .amt,.psub .dd{grid-column:span 1}}
</style>
</head>

<script>
"use strict";
/* ================= 基础 ================= */
const STAGES = ["需求","报价","审批","下单","物流"];
const ALL_STATUS = [...STAGES,"完结","已取消"];
const CLOSED=r=>r.status==="完结"||r.status==="已取消";
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);

const storage = (()=>{ // localStorage 保护(某些预览环境不可用)
  try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>m[k]??null,setItem:(k,v)=>m[k]=String(v),removeItem:k=>delete m[k]}; }
})();

let cfg = JSON.parse(storage.getItem("pt_cfg")||"null") || {name:"",owner:"",repo:"",branch:"main",path:"data/procurement.json",token:""};
let state = {records:[], suppliers:[], sha:null, loaded:false};
let currentId = null;

/* ================= 登录鉴权 ================= */
const AUTH_SALT="pt2026";
const ACCOUNTS={

  "Fang Jiang":"d40181ec07d24c5b276784d25f7629c1f174c5164864d937bbcd4bf572409e76",
  "Viewer":"726d9a8a6ca31e7807a4cd7c65146a95f94f391982b4bf1a0da7915486f736b8"
};
const READONLY_USERS=["Viewer"];
const isViewer=()=>READONLY_USERS.includes(authUser()||"");
function denyRO(){ toast("只读账号，无法修改数据","err"); return false; }
function sha256(ascii){
 function rightRotate(v,a){return (v>>>a)|(v<<(32-a));}
 var mathPow=Math.pow, maxWord=mathPow(2,32), result='';
 var words=[], asciiBitLength=ascii.length*8;
 var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], primeCounter=k.length;
 var isComposite={};
 for(var candidate=2; primeCounter<64; candidate++){
   if(!isComposite[candidate]){
     for(var i=0;i<313;i+=candidate) isComposite[i]=candidate;
     hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
     k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
   }
 }
 ascii+='\x80';
 while(ascii.length%64-56) ascii+='\x00';
 for(i=0;i<ascii.length;i++){var j=ascii.charCodeAt(i); if(j>>8) return; words[i>>2]|=j<<((3-i)%4)*8;}
 words[words.length]=(asciiBitLength/maxWord)|0; words[words.length]=asciiBitLength;
 for(j=0;j<words.length;){
   var w=words.slice(j,j+=16), oldHash=hash; hash=hash.slice(0,8);
   for(i=0;i<64;i++){
     var w15=w[i-15],w2=w[i-2];
     var a=hash[0],e=hash[4];
     var temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
     var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
     hash=[(temp1+temp2)|0].concat(hash); hash[4]=(hash[4]+temp1)|0;
   }
   for(i=0;i<8;i++) hash[i]=(hash[i]+oldHash[i])|0;
 }
 for(i=0;i<8;i++){ for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); } }
 return result;
}

/* ================= GitHub API ================= */
const ghReady=()=>cfg.owner&&cfg.repo&&cfg.token;
const apiBase=()=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/`;
const ghHeaders=(extra={})=>({Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...extra});

async function ghGetJSON(path){
  const r=await fetch(apiBase()+path+"?ref="+encodeURIComponent(cfg.branch)+"&_="+Date.now(),{headers:ghHeaders(),cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("读取失败 "+r.status);
  return r.json();
}
async function ghPut(path,contentB64,message,sha){
  const body={message,content:contentB64,branch:cfg.branch};
  if(sha) body.sha=sha;
  const r=await fetch(apiBase()+path,{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error("保存失败 "+r.status+(r.status===409?"(版本冲突)":"")+" "+t.slice(0,120)); }
  return r.json();
}
async function ghDelete(path,sha,message){
  const r=await fetch(apiBase()+path,{method:"DELETE",headers:ghHeaders(),body:JSON.stringify({message,sha,branch:cfg.branch})});
  if(!r.ok) throw new Error("删除失败 "+r.status);
}
const MIME={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",
  svg:"image/svg+xml",bmp:"image/bmp",txt:"text/plain;charset=utf-8",csv:"text/csv;charset=utf-8",json:"application/json",
  mp4:"video/mp4",mov:"video/quicktime"};
const mimeOf=name=>MIME[(name||"").split(".").pop().toLowerCase()]||"";
const canPreview=name=>!!mimeOf(name);
async function ghGetBlob(path,name){ // 私有仓库也能取文件(含>1MB)
  if(attCache[path]) return attCache[path];
  const r=await fetch(apiBase()+path+"?ref="+encodeURIComponent(cfg.branch),{headers:ghHeaders({Accept:"application/vnd.github.raw+json"})});
  if(!r.ok) throw new Error("附件读取失败 "+r.status);
  let blob=await r.blob();
  const mt=mimeOf(name||path);
  if(mt && blob.type!==mt) blob=new Blob([blob],{type:mt}); // 让浏览器能内联预览而不是下载
  const url=URL.createObjectURL(blob);
  attCache[path]=url; return url;
}

function setConn(ok,text){ $("#connDot").className="dot "+(ok===null?"":ok?"ok":"bad"); $("#connText").textContent=text; }

async function loadData(silent){
  if(!ghReady()){ setConn(false,"未配置"); render(); return; }
  setConn(null,"读取中…");
  try{
    const f=await ghGetJSON(cfg.path);
    if(f===null){ // 首次:创建空数据文件
      state.records=[]; state.suppliers=[]; state.sha=null; state.loaded=true;
      await persist("init: 创建数据文件");
      toast("已在仓库创建数据文件","ok");
    }else{
      const data=JSON.parse(b64decode(f.content));
      state.records=(data.records||[]).map(r=>r.status==="到货"?{...r,status:"物流"}:r);
      state.suppliers=data.suppliers||[];
      state.sha=f.sha; state.loaded=true;
    }
    setConn(true,`${cfg.owner}/${cfg.repo}`);
    $("#lastSync").style.display=""; $("#lastSync").textContent="同步 "+fmtDT(now()).slice(11);
    if(!silent) toast("数据已刷新","ok");
    render(); if(currentId) openDrawer(currentId,true);
  }catch(e){ setConn(false,"连接失败"); toast(e.message,"err"); render(); }
}

const remote_=a=>Array.isArray(a)?a:[];
function mergeSuppliers(remote,local){
  const map=new Map(remote.map(x=>[x.id,x]));
  for(const l of local){
    const r=map.get(l.id);
    if(l.deleted){ map.delete(l.id); continue; }
    if(!r || new Date(l.updatedAt||0)>new Date(r.updatedAt||0)) map.set(l.id,l);
  }
  return [...map.values()];
}
function mergeRecords(remote,local){
  const map=new Map(remote.map(r=>[r.id,r]));
  for(const l of local){
    const r=map.get(l.id);
    if(!r || new Date(l.updatedAt)>new Date(r.updatedAt)) map.set(l.id,l);
  }
  return [...map.values()];
}

async function persist(message){
  if(isViewer()){ toast("只读账号，改动不会保存","err"); return false; }
  if(!ghReady()){ toast("请先在设置里配置 GitHub 仓库","err"); return false; }
  try{
    // 保存前检查远端是否被同事改过
    const f=await ghGetJSON(cfg.path);
    if(f && f.sha!==state.sha && state.sha!==null){
      const data=JSON.parse(b64decode(f.content));
      state.records=mergeRecords(remote_(data.records),state.records);
      state.suppliers=mergeSuppliers(remote_(data.suppliers),state.suppliers);
      toast("检测到同事更新,已自动合并");
    }
    const payload=JSON.stringify({updatedAt:now(),updatedBy:cfg.name,records:state.records,suppliers:state.suppliers},null,2);
    const res=await ghPut(cfg.path,b64encode(payload),`${cfg.name||"匿名"}: ${message}`,f?f.sha:undefined);
    state.sha=res.content.sha;
    $("#lastSync").style.display=""; $("#lastSync").textContent="同步 "+fmtDT(now()).slice(11);
    return true;
  }catch(e){ toast(e.message,"err"); return false; }
}

/* ================= 附件:压缩 + 上传 ================= */
function compressImage(file,maxDim=1600,quality=.82){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(Math.max(w,h)>maxDim){ const k=maxDim/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej(new Error("压缩失败")),"image/jpeg",quality);
      URL.revokeObjectURL(img.src);
    };
    img.onerror=()=>rej(new Error("图片读取失败"));
    img.src=URL.createObjectURL(file);
  });
}
const blobToB64=blob=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });

async function uploadFiles(id,files,group){
  if(isViewer()) return denyRO();
  const rec=getRec(id); if(!rec)return;
  if(!ghReady()) return toast("请先配置 GitHub","err");
  for(const file of files){
    try{
      const isImg=/^image\//.test(file.type);
      let blob=file, name=file.name;
      if(isImg){ blob=await compressImage(file); name=name.replace(/\.[^.]+$/,"")+".jpg"; }
      if(blob.size>25*1048576){ toast(`${file.name} 超过25MB,已跳过`,"err"); continue; }
      const safe=name.replace(/[^\w.\-\u4e00-\u9fff]+/g,"_");
      const path=`uploads/${id}/${Date.now()}_${safe}`;
      toast(`上传中 ${safe} (${fmtSize(blob.size)})…`);
      const res=await ghPut(path,await blobToB64(blob),`${cfg.name}: 上传附件 ${rec.id}`);
      rec.attachments.push({name:safe,path,sha:res.content.sha,size:blob.size,type:isImg?"image":"file",group:group||"需求",by:cfg.name,at:now()});
      log(rec,"上传附件",safe);
    }catch(e){ toast(file.name+" 上传失败: "+e.message,"err"); }
  }
  if(currentId===id) openDrawer(id,true);
  render();
  await persist(`${rec.id} 附件更新`);
  toast("附件上传完成","ok");
}

function passFilter(r){
  const q=$("#fSearch").value.trim().toLowerCase();
  if(q){ const hay=(r.title+" "+(r.titleEn||"")+" "+(r.descEn||"")+" "+r.id+" "+r.job+" "+(r.sub||"")+" "+(r.quotes||[]).map(x=>x.supplier).join(" ")).toLowerCase(); if(!hay.includes(q))return false; }
  if($("#fJob").value && r.job!==$("#fJob").value) return false;
  if($("#fPerson").value && r.requester!==$("#fPerson").value) return false;
  if($("#fPri").value && r.pri!==$("#fPri").value) return false;

}
function railHTML(r){
  const idx=STAGES.indexOf(r.status);
  return `<div class="rail">${STAGES.map((s,i)=>{
    if(r.status==="已取消") return `<i class="${i===0?"dead":""}" title="已取消"></i>`;
    if(r.status==="完结") return `<i class="on" title="完结"></i>`;
    return `<i class="${i<idx?"on":i===idx?"now":""}" title="${s}"></i>`;
  }).join("")}</div>`;
}
const isDateStr=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"");
function cardDate(r){
  const today=new Date().toISOString().slice(0,10);
  if(r.status==="物流"||r.status==="完结"){
    const sp=r.ship||{};
    if(sp.arrived) return {label:"到货",text:fmtD(sp.arrived),late:false,tip:"实际到货日期"};
    if(sp.eta) return {label:"ETA",text:fmtD(sp.eta),late:sp.eta<today,tip:"预计到港日期"};
  }
  if(r.status==="下单"){
    if(r.eta) return {label:"交期",text:r.eta,late:isDateStr(r.eta)&&r.eta<today,tip:"交期(生产完成/可发运)"};
    const sp=r.ship||{};
    if(sp.eta) return {label:"ETA",text:fmtD(sp.eta),late:sp.eta<today,tip:"预计到港日期"};
  }
  if(r.neededBy) return {label:"需",text:fmtD(r.neededBy),late:r.status!=="物流"&&r.status!=="完结"&&r.status!=="已取消"&&r.neededBy<today,tip:"需要日期"};
  return null;
}
function cardHTML(r){
  const dt=cardDate(r);
  return `<article class="card" data-id="${r.id}" draggable="true" role="button" tabindex="0" aria-label="${esc(r.title)}">
    <div class="rid"><span>${r.id}</span><span class="pri ${r.pri}">${r.pri}</span></div>
    <h3>${esc(r.title)}</h3>
    ${r.titleEn?`<div class="ten-sm">${esc(r.titleEn)}</div>`:""}
    <div class="meta">
      ${r.job||r.sub?`<span class="tag job">${esc(fullJob(r))}</span>`:""}
      ${dt?`<span class="tag due ${dt.late?"overdue":""}" title="${esc(dt.tip)}">${dt.label} ${esc(dt.text)}${dt.late?" 逾期":""}</span>`:""}
    </div>
    ${railHTML(r)}
    <div class="foot"><span>👤 ${esc(r.requester||"—")}</span><span class="att">${r.attachments.length?"📎"+r.attachments.length:""} ${r.quotes.length?"💰"+r.quotes.length:""}</span></div>
  </article>`;
}
function render(){
  const showCancel=$("#fDone").checked;
  const cols=showCancel?ALL_STATUS:STAGES;
  const board=$("#board");
  board.style.gridTemplateColumns=window.innerWidth>1100?`repeat(${cols.length},1fr)`:"";
  const filtered=state.records.filter(passFilter);
  board.innerHTML=cols.map(st=>{
    const items=filtered.filter(r=>r.status===st);
    return `<section class="col" data-status="${st}">
      <div class="col-hd"><span class="nm">${st}</span><span class="ct">${items.length}</span></div>
      <div class="col-body">${items.length?items.map(cardHTML).join(""):`<div class="empty">${st==="需求"?"点右上角发布需求":"暂无"}</div>`}</div>
    </section>`;
  }).join("");
  // 填充筛选选项
  const jobs=[...new Set(state.records.map(r=>r.job).filter(Boolean))].sort();
  const ppl=[...new Set(state.records.map(r=>r.requester).filter(Boolean))].sort();
  fillSelect("#fJob",jobs,"全部项目"); fillSelect("#fPerson",ppl,"全部负责人");
  $("#jobList").innerHTML=jobs.map(j=>`<option value="${esc(j)}">`).join("");
  $("#countNote").textContent=`显示 ${filtered.filter(r=>cols.includes(r.status)).length} / 共 ${state.records.length} 条`;
  renderProjects();
  renderAlert();
  // 事件
  $$(".card").forEach(c=>{
    c.addEventListener("click",()=>openDrawer(c.dataset.id));
    c.addEventListener("keydown",e=>{if(e.key==="Enter")openDrawer(c.dataset.id)});
    c.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",c.dataset.id));
  });
  $$(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drag-over")});
    col.addEventListener("dragleave",()=>col.classList.remove("drag-over"));
    col.addEventListener("drop",e=>{
      e.preventDefault(); col.classList.remove("drag-over");
      if(isViewer()) return denyRO();
      const id=e.dataTransfer.getData("text/plain"), to=col.dataset.status;
      const rec=getRec(id);
      if(rec && rec.status!==to) changeStatus(id,to,"(拖拽调整)");
    });
  });
}

const isOrdered=r=>r.status==="下单"||r.status==="物流"||r.status==="完结";

const sh=r=>r.ship||{};
const etaLate=r=>{ const e=sh(r).eta; return !!(e && r.status!=="物流" && r.status!=="完结" && r.status!=="已取消" && e<new Date().toISOString().slice(0,10)); };
function orderInfo(r){
  const q=(r.quotes||[]).find(x=>x.selected)||{};
  const supplier=r.oSupplier||q.supplier||"";
  const cur=r.oCur||q.currency||"$";
  const price=(r.oPrice!==undefined&&r.oPrice!=="")?Number(r.oPrice):(q.price!==undefined?q.price:null);
  const amount=(price===null||isNaN(price))?"":`${cur}${price.toLocaleString(undefined,{maximumFractionDigits:2})}`;
  const overridden=!!(r.oSupplier&&q.supplier&&r.oSupplier!==q.supplier)||!!(r.oPrice!==undefined&&r.oPrice!==""&&q.price!==undefined&&Number(r.oPrice)!==q.price);
  return {supplier,amount,cur,price,lead:q.lead||"",quoteSupplier:q.supplier||"",quotePrice:q.price,quoteCur:q.currency||"$",overridden};
}

/* ================= 预警 / 导出 / 打印 ================= */
let alertOnly=false;
const daysTo=d=>{ if(!d) return null; return Math.round((new Date(d)-new Date(new Date().toISOString().slice(0,10)))/86400000); };
function alertLevel(r){
  if(r.status==="完结"||r.status==="已取消") return null;
  const eta=(r.ship&&r.ship.eta)||"", need=r.neededBy||"";
  const dl=eta||need; if(!dl) return null;
  const d=daysTo(dl);
  if(d===null) return null;
  if(d<0) return {lv:"逾期",d,dl,src:eta?"ETA":"需要日期"};
  if(d<=7) return {lv:"临近",d,dl,src:eta?"ETA":"需要日期"};
  return null;
}
function alertList(){ return state.records.map(r=>({r,a:alertLevel(r)})).filter(x=>x.a); }
function renderAlert(){
  const list=alertList(), late=list.filter(x=>x.a.lv==="逾期").length, soon=list.length-late;
  const el=$("#alertChip"); if(!el) return;
  if(!list.length){ el.style.display="none"; alertOnly=false; el.classList.remove("on"); return; }
  el.style.display=""; el.textContent=`⚠ 逾期 ${late}${soon?` · 7天内 ${soon}`:""}`;
  el.classList.toggle("on",alertOnly);
  el.title=list.slice(0,8).map(x=>`${x.r.title} · ${x.a.lv}(${x.a.src} ${fmtD(x.a.dl)})`).join("\n");
}

const csvCell=v=>{ const t=(v===undefined||v===null)?"":String(v); return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
function downloadCSV(name,rows){
  const csv="\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a"); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

function addBulkRow(v){
  v=v||{};
  const div=document.createElement("div");
  div.className="brow";
  div.innerHTML=`<input class="bsub" placeholder="NM01" value="${esc(v.sub||"")}">
    <input class="btitle" placeholder="例:移动破碎站" value="${esc(v.title||"")}">
    <input class="bten" placeholder="Mobile Crusher" value="${esc(v.titleEn||"")}">
    <input type="date" class="bdue" value="${esc(v.due||"")}">
    <button class="brm" title="删除本行">✕</button>`;
  div.querySelector(".brm").addEventListener("click",()=>{ div.remove(); if(![...$$("#bRows .brow")].length) addBulkRow(); updateBulkCount(); });
  div.querySelectorAll("input").forEach(i=>i.addEventListener("input",updateBulkCount));
  div.querySelector(".btitle").addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); const rows=[...$$("#bRows .brow")]; if(rows[rows.length-1]===div){ addBulkRow(); setTimeout(()=>{const rr=[...$$("#bRows .brow")]; rr[rr.length-1].querySelector(".bsub").focus();},10);} }

  const list=supAll().filter(sp=>!q||[sp.name,sp.nameEn,sp.tel,sp.addr,sp.tax,(sp.products||[]).map(x=>x.name+" "+(x.spec||"")).join(" ")].some(v=>(v||"").toLowerCase().includes(q)));

  const cnt=$("#supCount"); if(cnt) cnt.textContent=`共 ${state.suppliers.length} 家${list.length!==state.suppliers.length?` · 匹配 ${list.length}`:""}`;
  if(!list.length){ box.innerHTML=`<div class="sup-empty">${state.suppliers.length?"没有匹配的供应商":"还没有供应商,点右上角 ＋ 新增"}</div>`; return; }
  box.innerHTML=list.map(sp=>`<div class="sup-item ${openSups.has(sp.id)||q?"open":""}" data-supid="${esc(sp.id)}">
    <div class="sup-hd">
      <span class="sup-chev">▶</span>
      <div class="sup-nm">${esc(sp.name)}${sp.nameEn?`<div class="sup-en">${esc(sp.nameEn)}</div>`:""}</div>
      ${(sp.products||[]).length?`<span class="sup-cnt">${sp.products.length} 个产品</span>`:""}
      <button class="btn btn-sm" data-supedit="${esc(sp.id)}">编辑</button>
    </div>
    <div class="sup-body">
    <div class="sup-meta">
      ${sp.addr?`<b>地址</b><span>${esc(sp.addr)}</span>`:""}
      ${sp.tel?`<b>电话</b><span>${esc(sp.tel)}</span>`:""}
      ${sp.tax?`<b>税号</b><span>${esc(sp.tax)}</span>`:""}
      ${sp.bank?`<b>开户行</b><span>${esc(sp.bank)}</span>`:""}
      ${sp.acct?`<b>账户</b><span>${esc(sp.acct)}</span>`:""}
      ${sp.note?`<b>备注</b><span>${esc(sp.note)}</span>`:""}
    </div>
    ${(sp.products||[]).length?`<div class="sup-prods">${sp.products.map(pr=>`<span>${esc(pr.name)}${pr.spec?" · "+esc(pr.spec):""}</span>`).join("")}</div>`:""}
    ${supLinkHTML(sp)}
    </div>
  </div>`).join("");
  $$("#supList .sup-hd").forEach(h=>h.addEventListener("click",e=>{
    if(e.target.closest("[data-supedit]")) return;
    const item=h.parentElement, id=item.dataset.supid;
    item.classList.toggle("open");
    item.classList.contains("open")?openSups.add(id):openSups.delete(id);
  }));
  $$("#supList [data-supedit]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openSupEdit(b.dataset.supedit)}));
  $$("#supList [data-goto]").forEach(el=>el.addEventListener("click",e=>{ e.stopPropagation(); closeModal("mSupList"); openDrawer(el.dataset.goto); }));
}
function refreshSupDatalist(){
  const el=$("#supListData"); if(!el) return;
  el.innerHTML=supAll().map(sp=>`<option value="${esc(sp.name)}">${esc(sp.nameEn||"")}</option>`).join("");
}
let draftProds=[];
function renderDraftProds(){
  $("#spProdList").innerHTML=draftProds.map((pr,i)=>`<div class="prod-row">
    <span class="pn">${esc(pr.name)}</span>${pr.spec?`<span class="ps">${esc(pr.spec)}</span>`:""}
    <span style="flex:1"></span><button class="btn btn-sm" data-rmprod="${i}">✕</button></div>`).join("");
  $$("#spProdList [data-rmprod]").forEach(b=>b.addEventListener("click",()=>{ draftProds.splice(+b.dataset.rmprod,1); renderDraftProds(); }));
}
function addDraftProd(){
  const name=$("#spProdName").value.trim(), spec=$("#spProdSpec").value.trim();
  if(!name) return toast("请填写产品名称","err");
  if(draftProds.some(x=>x.name===name&&x.spec===spec)) return toast("该产品已在列表中","err");
  draftProds.push({name,spec});
  $("#spProdName").value=""; $("#spProdSpec").value="";
  renderDraftProds(); $("#spProdName").focus();
}
function openSupEdit(id){
  editingSupId=id||null;
  const sp=id?state.suppliers.find(x=>x.id===id):null;
  draftProds=sp&&Array.isArray(sp.products)?sp.products.map(x=>({...x})):[];
  $("#spProdName").value=""; $("#spProdSpec").value=""; renderDraftProds();
  $("#supEditTitle").textContent=sp?"编辑供应商":"新增供应商";
  $("#spName").value=sp?sp.name||"":""; $("#spNameEn").value=sp?sp.nameEn||"":"";
  $("#spAddr").value=sp?sp.addr||"":""; $("#spTel").value=sp?sp.tel||"":"";
  $("#spTax").value=sp?sp.tax||"":""; $("#spBank").value=sp?sp.bank||"":"";
  $("#spAcct").value=sp?sp.acct||"":""; $("#spNote").value=sp?sp.note||"":"";
  $("#spDelete").style.display=sp?"":"none";
  openModal("mSupEdit"); setTimeout(()=>$("#spName").focus(),50);
}
async function saveSupplier(){
  if(isViewer()) return denyRO();
  const name=$("#spName").value.trim();
  if(!name) return toast("中文名称必填","err");
  const data={name,nameEn:$("#spNameEn").value.trim(),addr:$("#spAddr").value.trim(),tel:$("#spTel").value.trim(),
              tax:$("#spTax").value.trim(),bank:$("#spBank").value.trim(),acct:$("#spAcct").value.trim(),
              note:$("#spNote").value.trim(),products:draftProds.slice(),updatedAt:now(),updatedBy:cfg.name};
  if(editingSupId){
    const i=state.suppliers.findIndex(x=>x.id===editingSupId);
    if(i<0) return toast("供应商不存在","err");
    state.suppliers[i]={...state.suppliers[i],...data};
  }else{
    if(state.suppliers.some(x=>x.name===name)) return toast("已存在同名供应商","err");
    state.suppliers.push({id:"SP-"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),
                          createdAt:now(),createdBy:cfg.name,...data});
  }
  closeModal("mSupEdit"); renderSuppliers(); refreshSupDatalist();
  if(await persist(`${editingSupId?"更新":"新增"}供应商 ${name}`)) toast("已保存","ok");
}
async function deleteSupplier(){
  if(isViewer()) return denyRO();
  const sp=state.suppliers.find(x=>x.id===editingSupId); if(!sp) return;
  if(!confirm(`删除供应商「${sp.name}」?已有报价记录不受影响。`)) return;
  state.suppliers=state.suppliers.filter(x=>x.id!==editingSupId);
  closeModal("mSupEdit"); renderSuppliers(); refreshSupDatalist();
  if(await persist(`删除供应商 ${sp.name}`)) toast("已删除","ok");
}

/* ================= 弹窗 / 设置 ================= */

function closeModal(id){ $("#"+id).classList.remove("open"); }
$$("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.close)));
$$(".modal-mask").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("open")}));

$("#btnNew").addEventListener("click",()=>{ $("#nReq").value=cfg.name||""; $("#nSub").value=""; $("#nTitleEn").value=""; $("#nDescEn").value=""; pendingFiles=[]; renderPendingAtt(); openModal("mNew"); setTimeout(()=>$("#nTitle").focus(),50); });

let pendingFiles=[];
function renderPendingAtt(){
  $("#nAttList").innerHTML=pendingFiles.map((f,i)=>`<div style="display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line-soft);border-radius:6px;padding:6px 10px">

});

$("#drawerMask").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){closeDrawer(); $$(".modal-mask.open").forEach(m=>m.classList.remove("open")); $("#lightbox").classList.remove("open");} });

$("#btnSettings").addEventListener("click",()=>openSettings());

$("#eSave").addEventListener("click",saveEditInfo);

function openSettings(){
  $("#sOwner").value=cfg.owner; $("#sRepo").value=cfg.repo;
  $("#sBranch").value=cfg.branch; $("#sPath").value=cfg.path; $("#sToken").value=cfg.token;
  openModal("mSettings");
}
$("#sSave").addEventListener("click",async()=>{
  cfg={name:authUser()||cfg.name,owner:$("#sOwner").value.trim(),repo:$("#sRepo").value.trim(),
       branch:$("#sBranch").value.trim()||"main",path:$("#sPath").value.trim()||"data/procurement.json",
       token:$("#sToken").value.trim()};
  if(!cfg.owner||!cfg.repo||!cfg.token) return toast("带 * 的必填","err");
  const save={...cfg}; if(!$("#sRemember").checked) save.token="";
  storage.setItem("pt_cfg",JSON.stringify(save));
  closeModal("mSettings");
  await loadData(true);
  if(state.loaded) toast("连接成功","ok");
});

/* ================= 启动 ================= */
function startApp(){
  if(ghReady()) loadData(true);
  else{ render(); setTimeout(()=>{ toast("首次使用:请点右上角 ⚙ 设置 连接 GitHub 仓库"); openSettings(); },400); }
}
(function init(){
  $("#lgBtn").addEventListener("click",doLogin);
  $("#lgPass").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
  $("#lgUser").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#lgPass").focus(); });
  $("#btnLogout").addEventListener("click",()=>{ sessionUser=null; storage.removeItem("pt_auth"); location.reload(); });
  storage.removeItem("pt_auth"); // 清除旧版本遗留的登录记忆
  setTimeout(()=>$("#lgUser").focus(),50);
  // 每3分钟自动刷新,避免同事更新看不到
  setInterval(()=>{ if(authUser() && ghReady() && !document.hidden && !currentId) loadData(true).catch(()=>{}); },180000);
})();

window.changeStatus=changeStatus; window.removeAttachment=removeAttachment;
